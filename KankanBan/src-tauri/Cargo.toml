[package]
name = "kankanban"
version = "0.0.0+1"
description = "以卡片为唯一原语的项目管理工具"
edition = "2021"
rust-version = "1.88"

[lib]
name = "kankanban_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "=0.22.1"
tauri-plugin-dialog = "=2.6.0"
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
sha2 = "=0.10.9"
tokio = { version = "=1.53.1", features = ["sync"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

[target.'cfg(windows)'.dependencies]
webview2-com = "=0.38.2"
windows = { version = "=0.61.3", features = ["Win32_Foundation", "Win32_System_Com", "Win32_System_Com_StructuredStorage"] }
