[package]
name = "kankanban"
version = "0.0.0+1"
description = "以卡片为唯一原语的项目管理工具"
edition = "2021"
rust-version = "1.77"

[lib]
name = "kankanban_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "=2.6.0"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
